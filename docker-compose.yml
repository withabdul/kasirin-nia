services:
  rontjeu-pos:
    build: .
    image: rontjeu-pos
    container_name: rontjeu-pos
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Postgres: container `postgres` (PG18) di network traefik-net.
      # Karena ikut network yang sama, hostname `postgres` bisa langsung dipakai.
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rontjeu.rule=Host(`pos-nia.berkoding.com`)"
      - "traefik.http.routers.rontjeu.entrypoints=websecure"
      - "traefik.http.routers.rontjeu.tls.certresolver=letsencrypt"
      - "traefik.http.services.rontjeu.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/kasir >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Network Traefik yang sudah ada di server ini (lihat ~/.services).
networks:
  traefik-net:
    external: true
